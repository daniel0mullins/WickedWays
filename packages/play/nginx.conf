# Server block for the play SPA. Installed at /etc/nginx/conf.d/default.conf,
# replacing nginx:alpine's default site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressible assets are pre-compressed at max level during the image's
    # serve stage (see packages/play/Dockerfile), so nginx just hands over the
    # .gz sibling and spends no CPU per request.
    gzip_static on;

    # Fallback for any response without a .gz sibling. The type list is chosen by
    # measurement on this bundle: wasm -68%, js -79%, css -35%. Fonts are omitted
    # on purpose — woff2 and woff are already internally compressed (Brotli and
    # zlib), and gzipping woff2 makes it marginally *larger*. text/html is always
    # compressed by the gzip module and needs no entry here.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Shared caches must key on Accept-Encoding — required alongside the
    # immutable Cache-Control below, or a cache can hand a gzipped body to a
    # client that never asked for one.
    gzip_vary on;

    # Coolify fronts this container with Traefik. nginx skips compression for
    # requests bearing a `Via` header unless told otherwise.
    gzip_proxied any;

    # Vite emits content-hashed files under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. The game has no client-side routes today, but this keeps a
    # refresh on any path serving the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
