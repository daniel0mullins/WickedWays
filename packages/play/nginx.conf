# Server block for the play SPA. Installed at /etc/nginx/conf.d/default.conf,
# replacing nginx:alpine's default site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Vite emits content-hashed files under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. The game has no client-side routes today, but this keeps a
    # refresh on any path serving the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
