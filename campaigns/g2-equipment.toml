[[items]]
key = "journal"
name = "Water-Stained Journal"
type = "consumable"
stat = "health"
modifier = 0
destroyable = true
droppable = false
lore = '''The journal's spine cracks as you open it. The early pages are a household's ordinary griefs — debts, a failing orchard, a wife taken too young. Then the hand changes. "We buried her in the cellar because the ground outside would not hold her. By the third night she had climbed halfway back." The ink grows frantic: a child who never wept, a face in the dark that was almost hers, an iron key forged to keep the cellar door honest. The last entries are barely words — "it wears her now; it wears all of us, in time" — and beneath them, pressed flat and brown, a sprig of the lilies they laid on a coffin that never stayed shut. Whoever kept this journal loved the house once. It did not love them back.'''
recipe = { item = 1 }

[[loot]]
name = "shelf"
room = "Hall"
items = ["lantern", "poker", "journal"]
