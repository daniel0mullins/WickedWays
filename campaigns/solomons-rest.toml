# ── Behaviors: NPC ───────────────────────────────────────────────────────────
[behaviors.npc.widow-marbury]
description = "A woman in mourning gray beneath the willow, her veil moving in a wind you cannot feel. Her grief is a hundred years old and perfectly patient."

[behaviors.npc.widow-marbury.default]
match = ""
response = "You should never have come in on a dare, children. But you are in now, and the gates keep till morning. Listen to an old widow: whatever else you do tonight, stay TOGETHER. The Sexton walks."

[[behaviors.npc.widow-marbury.dialogue]]
match = { fuzzy = ["sexton"] }
response = "He dug every grave here, and then his own, and did not stop working. The lodge bound him with a compact: from dusk-bell to daybreak he keeps the yard — but he may take only the sundered, the one cut off from the flock. While another living soul stands beside you, his hand is stayed. He knows it. It is why he will try so hard to get you alone."

[[behaviors.npc.widow-marbury.dialogue]]
match = { fuzzy = ["daybreak", "dawn", "morning", "sunrise"] }
response = "Endure to first light, dears. At daybreak he must go below — the compact allows him nothing else — and the lychgate will stand open of itself."

[[behaviors.npc.widow-marbury.dialogue]]
match = { fuzzy = ["fight", "kill", "weapon"] }
response = "The lesser dead can be put down: flame for the risen flesh, cold iron for the unquiet spirit, the craft's silver for the beasts that never lived. But the Sexton is not a thing you fight. He is a thing you outlast."

[[behaviors.npc.widow-marbury.dialogue]]
match = { fuzzy = ["key", "crypt", "locked", "door"] }
response = "The Tyler guards the chapel stair as he guarded the lodge door in life — his key goes below with him, unless someone puts him to rest. And the founder was buried with everything he valued, behind bronze. His wight keeps the bronze key, out among the mausoleums."

# ── Behaviors: scenes ────────────────────────────────────────────────────────
[behaviors.scene.the-dare]
canPlay = "!stateGet('played', false)"
onEnter = '''
  set state.played = true
  emit cue("The padlock snaps shut behind you and your friends' laughter fades down the road. The dare is simple: last until daybreak inside Solomon's Rest. Somewhere across the yard, right on cue, a bell you cannot see tolls dusk — and something under the ground hears it too.")
'''

[behaviors.scene.the-watcher]
canPlay = "!stateGet('seen', false)"
onEnter = '''
  set state.seen = true
  emit cue('Far down the rows a lantern swings — a tall figure with a spade over one shoulder, standing very still among the stones. It watches all of you, counts you, and does not come closer. Not yet.')
'''

[behaviors.scene.undercroft-chill]
canPlay = "!stateGet('seen', false)"
onEnter = '''
  set state.seen = true
  emit cue('The cold down here is older than the chapel above it. Lodge chests line the walls, and the dust on the floor shows no footprints at all — nothing walks here. Nothing has to.')
'''

[behaviors.scene.founders-reveal]
canPlay = "!stateGet('seen', false)"
onEnter = '''
  set state.seen = true
  emit cue("Marble, regalia, and the founder's long oak case. On the sarcophagus lid, freshly dusted as if tended nightly, someone keeps a ledger squared to the corner — the Sexton still makes his rounds in here.")
'''

# ── Behaviors: mechanics ─────────────────────────────────────────────────────
# The night clock — a Dread-style pressure that operates on the WORLD itself:
# the hour lives in world-scoped state (worldGet/setWorld), every behavior and
# the win condition can read it, and the villain's Black Bell can turn it back.
# Every 3 rounds an hour passes; each passing hour wears 1 Sanity off everyone
# still standing (the night itself is the tower being pulled). Hour 8 is
# daybreak.
[behaviors.mechanic.night-clock]
init = { ticks = 0 }
onRoundEnd = '''
  set state.ticks = stateGet('ticks', 0) + 1
  emit status(field('Night', lookup(mapLit('0', 'Dusk', '1', '9 PM', '2', '10 PM', '3', '11 PM', '4', 'Midnight', '5', '2 AM', '6', '3 AM', '7', 'False Dawn', '8', 'DAYBREAK'), str(worldGet('hour', 0))), worldGet('hour', 0) >= 6 ? 'warn' : 'normal'))
  guard stateGet('ticks', 0) >= 3
  set state.ticks = 0
  guard worldGet('hour', 0) < 8
  when worldGet('hour', 0) + 1 >= 8 {
    emit setWorld('hour', 8)
    emit setWorld('daybreak', true)
    emit cue('The east goes gray above the yews. Somewhere below, a spade is shouldered: the compact is spent. Daybreak.')
  }
  when worldGet('hour', 0) + 1 < 8 {
    emit setWorld('hour', worldGet('hour', 0) + 1)
    emit cue(lookup(mapLit('1', 'The dusk-bell fades. Nine o clock, by the chapel chime, and the last daylight drains out of the sky.', '2', 'Ten o clock. The gravel paths have gone silver and strange, and the rows do not seem to line up the way they did.', '3', 'Eleven. A lantern crosses the yard where no path runs. It pauses whenever one of you stands apart from the others.', '4', 'Midnight. The chime goes on one stroke too long. In the after-ring you hear a spade bite earth, patient as a heartbeat.', '5', 'Two in the morning — the chime skipped one entirely. The Sexton has been seen at the edge of the light, waiting. Never while you stand together. Only ever near whoever is alone.', '6', 'Three. The fog comes up to the knee, and under it the ground feels freshly turned. All of it.', '7', 'False dawn — a lie of gray light. The digging sounds have stopped. That is somehow worse.'), str(worldGet('hour', 0) + 1)))
    emit adjustStat(party[0], sanity, -1)
    emit adjustStat(party[1], sanity, -1)
    emit adjustStat(party[2], sanity, -1)
    emit adjustStat(party[3], sanity, -1)
  }
'''

# The compact: the Sexton cannot be harmed by anything the living carry, and
# his blows land ONLY on the sundered — a target with no conscious companion in
# the room takes his full strength; a witnessed target takes nothing. This is
# never stated outright: the party discovers it through zeroed blows, the
# hour cues, the widow, and the ledger.
[behaviors.mechanic.lone-prey]
init = {}
modifyDamage = "damage.target == 'mob:The Sexton' ? 0 : damage.source == 'mob:The Sexton' && some(party, element.id != damage.target && element.roomId == damage.room && !includes(element.status, 'ko')) ? 0 : damage.amount"

# The old wards: each supernatural haunt falls only to its bane, wielded in
# hand — fire for the wight, cold iron for the Tyler, lodge silver for the
# hounds. Anything else passes through them like cold fog.
[behaviors.mechanic.grave-wards]
init = {}
modifyDamage = "damage.target == 'mob:Wight of the Founder' && !some(party, element.id == damage.source && hasEquipped(element, 'torch')) ? 0 : damage.target == 'mob:The Tyler' && !some(party, element.id == damage.source && (hasEquipped(element, 'fence-spike') || hasEquipped(element, 'fence-spike-2'))) ? 0 : damage.target == 'campaign-mob:spectral hound' && !some(party, element.id == damage.source && hasEquipped(element, 'silver-trowel')) ? 0 : damage.amount"

# ── Behaviors: the Sexton's own cards ────────────────────────────────────────
[behaviors.card.toll-the-black-bell]
onPlay = '''
  emit cue('From the chapel a bell tolls — backward, the strokes swallowing themselves. The stars wheel the wrong way, and the night grows two hours longer.')
  emit setWorld('hour', worldGet('hour', 0) < 2 ? 0 : worldGet('hour', 0) - 2)
'''

[behaviors.card.cold-hands]
onPlay = '''
  emit cue('The ground softens like a held breath, and cold hands close around every living ankle in the yard. They do not pull. They just hold — and the holding is the worst of it.')
  emit adjustStat(party[0], sanity, -3)
  emit adjustStat(party[1], sanity, -3)
  emit adjustStat(party[2], sanity, -3)
  emit adjustStat(party[3], sanity, -3)
'''
