# ── Behaviors: keyed doors ───────────────────────────────────────────────────
[behaviors.exit.undercroft-door]
canPass = "stateGet('unlocked', false) || hasKey(actor, 'undercroft')"
failMessage = "The stair-door to the undercroft is locked — a keyhole of old brass, and the Tyler's post stands between you and whatever opens it."
runScript = '''
  when !stateGet('unlocked', false) {
    set state.unlocked = true
    pass 'The brass key turns twice. The stair-door swings open onto cellar dark.'
  }
'''

[behaviors.exit.founders-door]
canPass = "stateGet('unlocked', false) || hasKey(actor, 'founder')"
failMessage = "The bronze door of the founders mausoleum is locked fast. The keyhole is shaped like a compass rose."
runScript = '''
  when !stateGet('unlocked', false) {
    set state.unlocked = true
    pass 'The bronze key grinds through a century of verdigris, and the founders door swings inward.'
  }
'''

