# ── Victory ──────────────────────────────────────────────────────────────────
[[victory.win]]
key = "survived-to-daybreak"
test = "worldGet('daybreak', false) && some(party, !includes(element.status, 'ko'))"
narration = "Gray light crests the yews, and the birdsong is suddenly, absurdly ordinary. Down the rows a lantern gutters out, a spade is shouldered, and the Sexton goes below without a backward glance. The lychgate stands open. Whoever is still on their feet walks out of Solomon's Rest — and nobody ever takes the dare again."

[[victory.lose]]
key = "the-flock-is-taken"
test = "length(party) > 0 && every(party, includes(element.status, 'ko'))"
narration = "The last of you goes down, and the yard falls quiet. Unhurried footsteps. The scrape of a spade. The Sexton works until the sky pales, and by morning Solomon's Rest has four new mounds, unmarked, dug together — because even now, he keeps you together."

