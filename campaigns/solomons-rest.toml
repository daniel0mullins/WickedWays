# ── Rooms (the map is generated — no [[exits]]; see [mapGen] below) ──────────
[[rooms]]
name = "Lychgate"
image = "solomons-rest/lychgate.png"
description = "The roofed gate of Solomon's Rest. The iron scrollwork spells a square and compasses, and the padlock your friends clicked shut behind you is still warm."
spawnModifier = 0

[[rooms]]
name = "Gravel Path"
image = "solomons-rest/gravel-path.png"
description = "A ribbon of white gravel between leaning rows of slate. Your footsteps sound much louder than they should."

[[rooms]]
name = "Caretakers Lodge"
image = "solomons-rest/caretakers-lodge.png"
description = "A one-room stone lodge, door ajar. A kettle sits on a cold stove, and a coat hangs by the door as if its owner means to return."
spawnModifier = 0

[[rooms]]
name = "Toolshed"
image = "solomons-rest/toolshed.png"
description = "A lean-to of tar-papered boards. Rakes, twine, and grave-digging tools hang in orderly silhouettes."
spawnModifier = 0

[[rooms]]
name = "Chapel of the Compasses"
image = "solomons-rest/chapel-of-the-compasses.png"
description = "A small lodge chapel. Votive candles gutter beneath a wall of mason's marks, and a figure in an old-fashioned coat stands guard at the inner door — through you, the candlelight passes him entirely."

[[rooms]]
name = "Undercroft"
image = "solomons-rest/undercroft.png"
description = "A vaulted cellar beneath the chapel, black and bone-dry. Whatever the lodge kept down here, they kept it locked."
dark = true
spawnModifier = 0

[[rooms]]
name = "Old Yard"
image = "solomons-rest/old-yard.png"
description = "The oldest graves, their inscriptions worn to braille. A wrought-iron fence sags around a family plot, spikes loose in their sockets."

[[rooms]]
name = "Potters Field"
image = "solomons-rest/potters-field.png"
description = "Unmarked mounds under thistle. Something small and masked rummages in the leaf litter."
spawnModifier = 2

[[rooms]]
name = "Widows Willow"
image = "solomons-rest/widows-willow.png"
description = "A great willow weeps over a single white stone. A woman in mourning gray stands beneath it — she has been standing there a very long time."
spawnModifier = 0

[[rooms]]
name = "Mausoleum Row"
image = "solomons-rest/mausoleum-row.png"
description = "A street of little stone houses for the dead. One bronze door at the row's end is newer than the rest, and something inside one of the crypts is breathing."

[[rooms]]
name = "Founders Mausoleum"
image = "solomons-rest/founders-mausoleum.png"
description = "The founder's vault. A marble sarcophagus, a wall of lodge regalia — and a long oak case with brass hinges, the kind made for things that fire."
dark = true
spawnModifier = 0

[[rooms]]
name = "Columbarium"
image = "solomons-rest/columbarium.png"
description = "Walls of little brass-doored niches, urn after urn. A few doors hang open, ash spilled like spent hourglasses."

[[rooms]]
name = "Ossuary"
image = "solomons-rest/ossuary.png"
description = "A half-sunken vault stacked with folded bones. The femurs are sorted by length. Someone was very patient."
dark = true

[[rooms]]
name = "Charnel House"
image = "solomons-rest/charnel-house.png"
description = "A windowless outbuilding that smells of quicklime and old earth. The workbench is stained in ways a workbench should not be."
dark = true

[[rooms]]
name = "Obelisk Circle"
image = "solomons-rest/obelisk-circle.png"
description = "Nine granite obelisks in a ring, each carved with an all-seeing eye. Standing in the center, you are certain all nine are looking at you."

[[rooms]]
name = "Yew Alley"
image = "solomons-rest/yew-alley.png"
description = "A corridor of black yews clipped into walls. The dark between their trunks is total, and now and then it shifts."

[[rooms]]
name = "Reflecting Pool"
image = "solomons-rest/reflecting-pool.png"
description = "A long, still pool skinned with leaves. The reflections in it are a half-second behind, and one of them is not yours."

[[rooms]]
name = "Bone Hollow"
image = "solomons-rest/bone-hollow.png"
description = "A sunken dell where the ground has settled over something. Fog pools here knee-deep, and the grass grows in rib-shaped rows."
dark = true
spawnModifier = 2

# ── Procedural map: different every playthrough ──────────────────────────────
[mapGen]
extraConnections = 0.3
maxExitsPerRoom = 5
sealed = ["Undercroft", "Founders Mausoleum"]

[[mapGen.required]]
from = "Lychgate"
to = "Gravel Path"

[[mapGen.required]]
from = "Chapel of the Compasses"
to = "Undercroft"
behavior = "undercroft-door"
name = "undercroft stair-door"
initialState = { unlocked = false }

[[mapGen.required]]
from = "Mausoleum Row"
to = "Founders Mausoleum"
behavior = "founders-door"
name = "founders bronze door"
initialState = { unlocked = false }

