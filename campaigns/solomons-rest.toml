# The Dare at Solomon's Rest — survive one night in the old Masonic cemetery.
#
# Four teenagers take a dare: last until daybreak inside the locked gates of
# Solomon's Rest. The Sexton — the cemetery's dead groundskeeper — hunts them
# with a deck of Wicked Ways cards built to split the party, because the old
# compact only lets him take the living when they are ALONE. The map is
# procedurally generated ([mapGen]): every playthrough lays the yards, crypts,
# and paths out differently, with the two locked crypts (`sealed`) always
# behind their keyed doors. A world-scoped night clock (worldGet/setWorld)
# marches toward daybreak; the party wins if ANYONE is still conscious when it
# strikes, and loses when the whole party is dead or incapacitated.

title = "The Dare at Solomon's Rest"
startRoom = "Lychgate"
timeoutNarration = "The bell tolls an hour no clock owns. You count them: thirteen. Dawn is not coming — not for you, not ever — and somewhere among the stones the Sexton begins, unhurried, to dig four new graves."

[opts]
maxRounds = 60
baseEncounterChance = 25

