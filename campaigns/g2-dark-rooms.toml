# g2-dark-rooms — authors the g2-dark-rooms golden pair.
# Proves the room sub-fields the author previously dropped: `dark` (a lightless
# Cellar) and `spawnModifier` (a biased-encounter Hall). Rooms connected so neither
# is pruned. ASCII only.

title = "Dark Rooms"
startRoom = "Hall"

[[rooms]]
name = "Hall"
description = "A long central hall."
spawnModifier = 1
[[rooms]]
name = "Cellar"
description = "The cellar below."
dark = true

[[exits]]
from = "Hall"
to = "Cellar"
direction = "south"
