# Changeset guard: a PR that changes shipped code must add a changeset (.changesets/*.md) so the
# change reaches the next release's CHANGELOG (see .changesets/README.md). Exempt paths are
# handled in the script (docs/CI/goldens-only PRs pass); a maintainer exempts anything else with
# the `no-changeset` label. Release PRs pass by touching CHANGELOG.md.
name: changeset
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changeset:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changeset for shipped-code changes
        run: |
          set -euo pipefail
          # Shipped code: the crates, the authored campaigns + assets, the desktop shell, and
          # the root manifests. Everything else (docs, CI, goldens, landing/) releases nothing.
          if git diff --quiet "$BASE"...HEAD -- crates campaigns desktop Cargo.toml Cargo.lock; then
            echo "No shipped-code changes — no changeset needed."
            exit 0
          fi
          # A release PR consumes changesets instead of adding one.
          if ! git diff --quiet "$BASE"...HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md changed — release PR, no changeset needed."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '.changesets/*.md' \
            | grep -v 'README.md' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR changes shipped code but adds no changeset."
            echo "Record one with: cargo xtask add <major|minor|patch> \"<summary>\""
            echo "(see .changesets/README.md; or apply the no-changeset label to exempt this PR)"
            exit 1
          fi
          echo "Changesets added:"
          echo "$added"
