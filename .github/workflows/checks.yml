name: Checks

# Run lint, typecheck, and tests on every pull request (opened, reopened, and
# on each new push to the PR branch).
on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run checks
