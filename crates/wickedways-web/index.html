<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WickedWays</title>
    <style>
      /* Reset the default body margin: without it the white page background shows as a border around
         the full-viewport dark app, and `min-height: 100vh` + the margin overflows into a scrollbar. */
      html, body { margin: 0; padding: 0; background: #111; }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <!--
      Loads the wasm-bindgen `--target web` output that `build-web.sh` emits next to this file.
      Dioxus mounts the app into <body>. Served static (same-origin with /ws) by the C axum binary
      or any static server — see README.md.
    -->
    <script type="module">
      import init from "./wickedways-web.js";
      init();
    </script>
  </body>
</html>
