[package]
name = "wickedways-web"
version = "0.0.1"
edition = "2021"

# The Dioxus web client (Phase 2c, sub-project D). Slice 0 is the CSS-carryover
# spike + skeleton: it proves a Dioxus app compiles to wasm32 in this environment,
# that the campaign CRT theming (CSS custom properties) carries from Lit to RSX,
# and that `wickedways-core` links DIRECTLY (rlib, no wasm-pack/JS boundary) and
# runs on wasm. The real transport + surfaces land in slices 1-5.
#
# This crate targets wasm32-unknown-unknown; build it with
#   cargo build -p wickedways-web --target wasm32-unknown-unknown
# (see the D plan for the bundling step).

[lib]
name = "wickedways_web"
path = "src/lib.rs"

[[bin]]
name = "wickedways-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
# The engine, linked directly as a Rust crate (both compile to the same wasm
# target) — no JS interop. The default `std` feature is available on wasm32.
wickedways-core = { path = "../wickedways-core" }
# The shared wire protocol — the same types the room server speaks.
wickedways-transport = { path = "../wickedways-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser bindings for the WebSocket transport (compile on host too — they are just
# extern declarations — so the mirror's host tests are unaffected).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
futures-util = "0.3"
web-sys = { version = "0.3", features = [
  "WebSocket", "MessageEvent", "Event", "CloseEvent", "BinaryType",
  "Window", "Location", "UrlSearchParams", "Storage",
  # Web Audio — the AudioEngine renders a SynthVoice as one-shot oscillator/noise + gain envelope,
  # and the AmbientBed runs a sanity-reactive drone (two sawtooths → biquad low-pass → gain).
  "AudioContext", "BaseAudioContext", "AudioContextState", "AudioNode", "AudioParam",
  "GainNode", "OscillatorNode", "OscillatorType", "AudioDestinationNode",
  "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode",
  "BiquadFilterNode", "BiquadFilterType",
] }
