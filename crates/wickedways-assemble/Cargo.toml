[package]
name = "wickedways-assemble"
version = "0.0.1"
edition = "2021"

[dependencies]
wickedways-core = { path = "../wickedways-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTE: `rand` and `uuid` are deliberately absent. Ids are derived, never generated.
# Adding either is a spec violation.

[dev-dependencies]
# The replay gate compiles the `conformance:` native behaviors in — several
# replay fixtures reference them.
wickedways-core = { path = "../wickedways-core", features = ["conformance"] }

[lints]
workspace = true
