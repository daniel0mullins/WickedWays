[package]
name = "wickedways-transport"
version = "0.0.1"
edition = "2021"

# The multiplayer wire protocol (Phase 2c). Shared by the axum room server
# (sub-project C, `wickedways-server`) and the Dioxus web client (sub-project D,
# `wickedways-web`) so both speak byte-identical `ClientMsg`/`ServerMsg`. Has no
# engine dependency — `command`/`delta`/`snapshot` are opaque `serde_json::Value`,
# relayed and ordered without understanding the engine.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
