[package]
name = "wickedways-server"
version.workspace = true
edition = "2021"

# The room server. Hosts a native `SyncAuthority`
# per campaign, gates appends by seat ownership, persists durably, and speaks the
# `wickedways-transport` wire protocol. Native-only (std) — not a wasm target.

[[bin]]
name = "wickedways-server"
path = "src/main.rs"

[dependencies]
wickedways-core = { path = "../wickedways-core", features = ["std"] }
wickedways-transport = { path = "../wickedways-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
# Serves the bundled Dioxus web client (static WASM + assets) as a fallback alongside `/ws`, so one
# binary serves the app and the multiplayer socket on one port (the deploy topology).
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
# rusqlite is synchronous; the per-campaign Table actor serializes access and
# drives store calls via tokio::task::spawn_blocking. `bundled`
# compiles SQLite in-tree so there is no system-lib dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

# NOTE: rand/uuid are deliberately absent, mirroring the other crates — ids are
# derived by the core, never generated here.

[dev-dependencies]
# A real WebSocket client for the two-client convergence e2e test. tokio-tungstenite
# is already in the tree (axum's ws feature pulls it); pinning it here makes it a client.
tokio-tungstenite = "0.29"
futures-util = "0.3"

[lints]
workspace = true
