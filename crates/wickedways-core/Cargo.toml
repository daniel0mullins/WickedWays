[package]
name = "wickedways-core"
version = "0.0.1"
edition = "2021"

[features]
default = ["std"]
std = ["serde/std"]
ts = ["dep:ts-rs", "std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ts-rs = { version = "10", optional = true }

[dev-dependencies]
proptest = "1"
