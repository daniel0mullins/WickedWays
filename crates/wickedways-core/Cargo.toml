[package]
name = "wickedways-core"
version.workspace = true
edition = "2021"

[features]
default = ["std"]
std = ["serde/std"]
conformance = []

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# float_roundtrip: the default float parser is lossy (a serialized f64 can
# parse back as a *different* f64), which perturbs stats on snapshot load and
# breaks replay-golden byte-parity. The roundtrip parser restores exactness.
serde_json = { version = "1", default-features = false, features = [
    "alloc",
    "float_roundtrip",
] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
