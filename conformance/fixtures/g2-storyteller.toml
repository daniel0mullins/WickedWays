# g2-storyteller — authors the g2-storyteller golden pair: the REAL hollow-house `storyteller`
# mechanic over a 1-entry lore map, proving this slice's forms: the `action`
# subject, `mapLit`, `has`, `lookup`, `stateGetIn`, and the `set state.<map>[<key>]`
# (`setStateIn`) statement. `init = { seen = {} }` seeds the genesis state.
# ASCII only.

title = "Storyteller"
startRoom = "Parlor"

[[rooms]]
name = "Parlor"
description = "A mildewed parlor."

[[mechanics]]
key = "storyteller"

[behaviors.mechanic.storyteller]
init = { seen = {} }
onAction = '''
  guard action.kind == 'move'
  guard has(mapLit('Parlor', 'A mildewed parlor.'), action.room.name)
  guard hasItem(actor, 'journal')
  guard !stateGetIn('seen', action.room.name, false)
  set state.seen[action.room.name] = true
  emit cue(lookup(mapLit('Parlor', 'A mildewed parlor.'), action.room.name))
'''
