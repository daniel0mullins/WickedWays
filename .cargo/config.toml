# Pin off the post-MVP WebAssembly features recent stable rustc enables by default
# for wasm32-unknown-unknown (`reference-types`, `multivalue`).
#
# With them on, wasm-bindgen emits a second (externref) table, and wasm-pack's
# bundled `wasm-opt` (binaryen, MVP-only) rejects the module
# ("Only 1 table definition allowed in MVP"), breaking `pnpm run wasm:build` /
# `wasm:build:web`. Turning them off restores the single-table MVP output wasm-opt
# expects — the engine (wickedways-wasm) and the Dioxus client (wickedways-web)
# both build clean. Harmless: these features were not used before rustc turned them
# on by default, and disabling them only affects wasm codegen (host builds are
# untouched — this target scope excludes them).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-reference-types,-multivalue"]
