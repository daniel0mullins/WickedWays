<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wicked Ways — You're In</title>
    <meta
      name="description"
      content="You're now part of the circle. You'll be the first to know when Wicked Ways emerges from the shadows."
    />
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=EB+Garamond:ital@0;1&family=Inter:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="confirm">
      <!-- Atmospheric overlays -->
      <div class="overlay overlay--vignette" aria-hidden="true"></div>
      <div class="overlay overlay--bottom" aria-hidden="true"></div>

      <!-- Success icon -->
      <div class="confirm__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>

      <h1 class="confirm__headline">Welcome to the Darkness</h1>
      <p class="confirm__subheadline">You're now part of the circle</p>
      <p class="confirm__message">
        You'll be the first to know when Wicked Ways emerges from the shadows.<br />
        Check your inbox for a confirmation from the other side.
      </p>

      <div class="confirm__divider" aria-hidden="true"></div>

      <nav class="social" aria-label="Social links">
        <span class="social__label">Follow the darkness:</span>
        <a
          class="social__icon"
          href="https://x.com/wickedways_vtt"
          aria-label="Twitter / X"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"
            />
          </svg>
        </a>
        <a
          class="social__icon"
          href="https://discord.gg/"
          aria-label="Discord"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </a>
        <a
          class="social__icon"
          href="https://www.instagram.com/wickedways_vtt/"
          aria-label="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
          </svg>
        </a>
      </nav>

      <a class="back-button" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        <span>Return to the Shadows</span>
      </a>
    </main>
  </body>
</html>
