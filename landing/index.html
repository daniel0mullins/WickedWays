<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wicked Ways — A New Horror Awaits</title>
    <meta
      name="description"
      content="Wicked Ways — a new horror experience. Launching Fall 2026. Join the darkness."
    />

    <!-- Social / share -->
    <meta property="og:title" content="Wicked Ways — A New Horror Awaits" />
    <meta
      property="og:description"
      content="A new horror experience. Launching Fall 2026."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/hero-bg.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=EB+Garamond:ital@0;1&family=Inter:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script id="mcjs">
      !(function (c, h, i, m, p) {
        ((m = c.createElement(h)),
          (p = c.getElementsByTagName(h)[0]),
          (m.async = 1),
          (m.src = i),
          p.parentNode.insertBefore(m, p));
      })(
        document,
        "script",
        "https://chimpstatic.com/mcjs-connected/js/users/7f0a19f5d7d14fc169ab4d07e/0c4190ef906b11ccdb63a062d.js",
      );
    </script>
  </head>
  <body>
    <main class="hero">
      <!-- Atmospheric overlays -->
      <div class="overlay overlay--vignette" aria-hidden="true"></div>
      <div class="overlay overlay--bottom" aria-hidden="true"></div>

      <!-- Top: coming soon badge -->
      <header class="hero__top">
        <span class="badge">Coming Soon</span>
      </header>

      <!-- Center: title + taglines -->
      <div class="hero__center">
        <h1 class="title">Wicked Ways</h1>
        <p class="tagline">A New Horror Awaits</p>
        <p class="release">Launching Fall 2026</p>
      </div>

      <!-- Bottom: social + signup -->
      <div class="hero__bottom">
        <nav class="social" aria-label="Social links">
          <span class="social__label">Follow the darkness:</span>
          <a class="social__icon" href="#" aria-label="Twitter / X">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"
              />
            </svg>
          </a>
          <a class="social__icon" href="#" aria-label="Discord">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
            </svg>
          </a>
          <a class="social__icon" href="#" aria-label="Instagram">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
              <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
            </svg>
          </a>
        </nav>

        <section class="signup" aria-label="Email signup">
          <h2 class="signup__headline">Join the Darkness</h2>
          <p class="signup__tagline">
            Be the first to know when the nightmare begins
          </p>
          <form class="signup__form" action="#" method="post">
            <input
              class="signup__input"
              type="email"
              name="email"
              placeholder="Enter your email address"
              aria-label="Email address"
              required
            />
            <button class="signup__button" type="submit">Notify Me</button>
          </form>
          <p class="signup__disclaimer">
            No spam. Only whispers from the void.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
